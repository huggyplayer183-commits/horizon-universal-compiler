[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-universal-compiler"
version = "0.1.0"
description = "Universal Minecraft project compiler for Horizon"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
huc = "huc.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
